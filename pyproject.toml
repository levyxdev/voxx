[project]
name = "voxx"
version = "0.1.0.dev0"
description = "Local text-to-speech CLI for agents: narrate each Line to a WAV with word timings"
license = "Apache-2.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "mlx-audio==0.6.3 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "numpy>=2",
    "pyloudnorm==0.2.0",
    "scipy>=1.10",
]

[project.scripts]
voxx = "voxx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
# pytest puts tests/ on sys.path, so tests import conftest and fake_hub by name.
extraPaths = ["tests"]
