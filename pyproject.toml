[project]
name = "voxx"
version = "0.1.0.dev0"
description = "Local text-to-speech CLI for agents: narrate each Line to a WAV with word timings"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["numpy>=2"]

[project.scripts]
voxx = "voxx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
